name: Build APK
run-name: Build APK ${{ inputs.run_tag }} (${{ inputs.variant }})
on:
  workflow_dispatch:
    inputs:
      run_tag:
        description: 'run tag (unique)'
        required: true
      variant:
        description: 'debug or release'
        required: false
        default: 'debug'
      app_id:
        description: 'optional applicationId override'
        required: false
        default: ''
      apk_name:
        description: 'APK filename (without .apk), empty = auto'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true

      - name: Extract source
        run: |
          set -e
          rm -rf work && mkdir -p work
          unzip -q source.zip -d work
          PROJ=$(find work -maxdepth 3 -name settings.gradle.kts -printf '%h\n' | head -1)
          if [ -z "$PROJ" ]; then echo "::error::source.zip 里找不到 settings.gradle.kts"; exit 1; fi
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          echo "工程根：$PROJ"

      - name: Patch local-only settings
        run: |
          cd "$PROJ"
          sed -i '/aapt2FromMavenOverride/d;/trustStore/d;/trustStorePassword/d;/trustStoreType/d' gradle.properties || true
          grep -q '^org.gradle.jvmargs=' gradle.properties || echo 'org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' >> gradle.properties
          if [ -n "${{ inputs.app_id }}" ]; then
            sed -i "s/applicationId[[:space:]]*=[[:space:]]*\"[^\"]*\"/applicationId = \"${{ inputs.app_id }}\"/" app/build.gradle.kts || true
            echo "applicationId 改成 ${{ inputs.app_id }}"
          fi

      - name: Build
        run: |
          set -e
          cd "$PROJ"
          chmod +x gradlew
          if [ "${{ inputs.variant }}" = "release" ]; then
            ./gradlew :app:assembleRelease --no-daemon -PONEXTBOX_CI_SIGN_RELEASE_WITH_DEBUG=true
          else
            ./gradlew :app:assembleDebug --no-daemon
          fi

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ inputs.variant }}
          APK_NAME: ${{ inputs.apk_name }}
          RUN_TAG: ${{ inputs.run_tag }}
        run: |
          set -e
          cd "$PROJ"

          # 精确定位本次编译产物，避免拿到 intermediates 或旧的 APK
          APK=""
          if [ "$VARIANT" = "release" ]; then
            for p in "app/build/outputs/apk/release/app-release.apk" \
                     "app/build/outputs/apk/release/app-release-signed.apk"; do
              [ -f "$p" ] && { APK="$p"; break; }
            done
            if [ -z "$APK" ]; then
              APK=$(find . -path '*/outputs/apk/release/*.apk' ! -name '*unsigned*' | head -1)
            fi
            if [ -z "$APK" ]; then
              APK=$(find . -path '*/outputs/apk/release/*.apk' | head -1)
            fi
          else
            for p in "app/build/outputs/apk/debug/app-debug.apk"; do
              [ -f "$p" ] && { APK="$p"; break; }
            done
            [ -z "$APK" ] && APK=$(find . -path '*/outputs/apk/debug/*.apk' | head -1)
          fi

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "::error::没找到编译产物"; exit 1
          fi
          echo "原始 APK：$APK ($(du -h "$APK" | cut -f1))"

          # 决定输出文件名
          NAME="${APK_NAME:-app-$RUN_TAG}"
          NAME=$(echo "$NAME" | tr -d '/\\:*?"<>|' | sed -E 's/^[.[:space:]]+|[[:space:]]+$//g')
          NAME="${NAME%.apk}"
          [ -z "$NAME" ] && NAME="app-$RUN_TAG"
          OUT="${NAME}.apk"

          cp "$APK" "$OUT"
          echo "输出 APK：$OUT ($(du -h "$OUT" | cut -f1))"

          # 每次都是全新 tag，保证是本次最新产物
          gh release create "apk-$RUN_TAG" "$OUT" \
            --title "$NAME" \
            --notes "自动编译产物（$VARIANT） · $OUT" \
            --latest=false || gh release upload "apk-$RUN_TAG" "$OUT" --clobber
