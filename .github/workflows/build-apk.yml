name: Build APK
on:
  workflow_dispatch:
    inputs:
      run_tag:
        description: 'run tag (unique)'
        required: true
      variant:
        description: 'debug or release'
        required: false
        default: 'debug'
      app_id:
        description: 'optional applicationId override'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true

      - name: Extract source
        run: |
          set -e
          rm -rf work && mkdir -p work
          unzip -q source.zip -d work
          PROJ=$(find work -maxdepth 3 -name settings.gradle.kts -printf '%h\n' | head -1)
          if [ -z "$PROJ" ]; then echo "::error::source.zip 里找不到 settings.gradle.kts"; exit 1; fi
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          echo "工程根：$PROJ"

      - name: Patch local-only settings
        run: |
          cd "$PROJ"
          sed -i '/aapt2FromMavenOverride/d;/trustStore/d;/trustStorePassword/d;/trustStoreType/d' gradle.properties || true
          grep -q '^org.gradle.jvmargs=' gradle.properties || echo 'org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' >> gradle.properties
          if [ -n "${{ inputs.app_id }}" ]; then
            sed -i "s/applicationId[[:space:]]*=[[:space:]]*\"[^\"]*\"/applicationId = \"${{ inputs.app_id }}\"/" app/build.gradle.kts || true
            echo "applicationId 改成 ${{ inputs.app_id }}"
          fi

      - name: Build
        run: |
          set -e
          cd "$PROJ"
          chmod +x gradlew
          if [ "${{ inputs.variant }}" = "release" ]; then
            ./gradlew :app:assembleRelease --no-daemon -PONEXTBOX_CI_SIGN_RELEASE_WITH_DEBUG=true
          else
            ./gradlew :app:assembleDebug --no-daemon
          fi

      - name: Publish APK (replace previous)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK=$(find "$PROJ" -path '*/outputs/apk/*' -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "::error::没找到编译产物"; exit 1; fi
          OUT="app-latest.apk"
          cp "$APK" "$OUT"
          echo "APK 大小：$(du -h "$OUT" | cut -f1)"
          # 只保留一个 latest 发布，旧的连同 tag 一起删掉，链接永远指向最新
          gh release delete latest-apk -y --cleanup-tag 2>/dev/null || true
          gh release create latest-apk "$OUT" \
            --title "最新 APK" \
            --notes "每次编译覆盖此发布（${{ inputs.variant }} / ${{ inputs.run_tag }}）"
